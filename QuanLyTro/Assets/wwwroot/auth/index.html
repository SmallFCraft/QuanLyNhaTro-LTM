<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · Quản Lý Phòng Trọ Ngũ Hành Sơn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/css/tokens.css">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="login-card">
  <div class="login-body">
    <div class="app-icon"><i class="fas fa-warehouse"></i></div>
    <div class="app-name">Ký Túc Xá &amp; Nhà Trọ Số</div>
    <div class="app-sub">Phường Ngũ Hành Sơn · TP. Đà Nẵng</div>

    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab on" id="tabLogin" role="tab" onclick="switchAuthTab('login')">
        <i class="fas fa-sign-in-alt"></i> Đăng nhập
      </button>
      <button type="button" class="auth-tab" id="tabRegister" role="tab" onclick="switchAuthTab('register')">
        <i class="fas fa-user-plus"></i> Đăng ký
      </button>
    </div>

    <form id="formLogin" onsubmit="doLogin();return false">
      <label id="lblAcc"><i class="fas fa-user"></i> Tài khoản</label>
      <input class="inp mono" id="lu" placeholder="Tên tài khoản hoặc số CCCD của người thuê">
      <label><i class="fas fa-lock"></i> Mật khẩu</label>
      <input class="inp mono" type="password" id="lp" placeholder="••••••••">
      <label></label>
      <button type="submit" class="btn btn-primary" style="justify-content:center"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
    </form>

    <form id="formRegister" style="display:none" onsubmit="doRegister();return false">
      <label><i class="fas fa-id-card"></i> Họ tên</label>
      <input class="inp" id="regHoTen" placeholder="Nguyễn Văn A">
      <label><i class="fas fa-cake-candles"></i> Ngày sinh</label>
      <input class="inp mono" type="date" id="regNgaySinh">
      <label><i class="fas fa-address-card"></i> Số CCCD</label>
      <input class="inp mono" id="regCccd" maxlength="12" placeholder="12 chữ số">
      <label><i class="fas fa-phone"></i> Số điện thoại</label>
      <input class="inp mono" id="regSdt" placeholder="09xxxxxxxx">
      <label><i class="fas fa-location-dot"></i> Quê quán</label>
      <input class="inp" id="regQueQuan" placeholder="Xã/Phường, Quận/Huyện, Tỉnh">
      <label><i class="fas fa-briefcase"></i> Nơi làm việc</label>
      <input class="inp" id="regNoiLamViec" placeholder="Không bắt buộc">
      <label><i class="fas fa-lock"></i> Mật khẩu</label>
      <input class="inp" type="password" id="regMatKhau" placeholder="Từ 6 ký tự trở lên">
      <label></label>
      <button type="submit" class="btn btn-primary" style="justify-content:center"><i class="fas fa-user-plus"></i> Đăng ký</button>
    </form>

    <div class="conn" id="srv-status" data-state="init" aria-live="polite">
      <span class="dot"></span><span class="txt">Đang kiểm tra kết nối máy chủ…</span>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<script src="../shared/js/bridge.js"></script>
<script src="../shared/js/ui.js"></script>
<script src="auth.js"></script>
</body>
</html>
