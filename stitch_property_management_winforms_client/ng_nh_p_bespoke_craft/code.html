</script><style>

</style></head><body class="font-sans text-on-surface bg-background select-none min-h-screen relative overflow-x-hidden antialiased fine-grid"><main class="flex flex-col relative w-full pt-safe pb-safe min-h-screen justify-center items-center px-4 py-8">
<!-- Main Workstation Window Card -->
<div class="relative z-10 w-full max-w-xl mx-auto tactile-card rounded-lg overflow-hidden flex flex-col">
<!-- Native Desktop / Precision Header Bar -->
<header class="flex items-center justify-between px-4 py-3 bg-[#13171a] border-b border-[#262a2e]">
<div class="flex items-center space-x-3 min-w-0">
<div class="w-7 h-7 rounded bg-[#262a2e] border border-[#363b41] flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[16px]">domain</span>
</div>
<div class="flex items-baseline space-x-2 truncate">
<span class="text-xs font-semibold tracking-tight text-[#f0f3f6]">Quản Lý Phòng Trọ .NET 8</span>
<span class="text-[11px] font-mono text-[#767e88]">v8.2-LTS</span>
</div>
</div>
<!-- Window hanh_dong buttons -->
<div class="flex items-center space-x-1 pl-2">
<button aria-label="Minimize" class="w-6 h-6 rounded flex items-center justify-center text-[#767e88] hover:text-[#e0e3e7] hover:bg-[#202529] transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">remove</span>
</button>
<button aria-label="Help" class="w-6 h-6 rounded flex items-center justify-center text-[#767e88] hover:text-[#e0e3e7] hover:bg-[#202529] transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">help</span>
</button>
<button aria-label="Close" class="w-6 h-6 rounded flex items-center justify-center text-[#767e88] hover:text-[#ffb4ab] hover:bg-[#32191b] transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
</header>
<!-- Title & Node Overview Strip -->
<div class="px-5 py-4 bg-[#15191c] border-b border-[#262a2e] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
<div>
<div class="flex items-center gap-2">
<h1 class="text-sm font-semibold tracking-wide uppercase text-[#f2ede9]">KÝ TÚC XÁ &amp; NHÀ TRỌ SỐ</h1>
<span class="font-mono text-[10px] uppercase tracking-wider text-[#a78b83] bg-[#221c1a] border border-[#3d2a24] px-1.5 py-0.5 rounded">Core Console</span>
</div>
<p class="text-[12px] text-[#868e96] font-mono mt-0.5 flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-[#56a070]"></span>
<span>TCP Socket Async Host: 127.0.0.1:8088</span>
</p>
</div>
<div class="flex items-center space-x-2 self-start sm:self-auto bg-[#1a1f23] border border-[#2c3237] px-2.5 py-1.5 rounded text-[11px] font-mono">
<span class="text-[#767e88]">NODE:</span>
<span class="text-[#56a070] font-medium">IOPC-ONLINE</span>
<span class="text-[#3c444c]">|</span>
<span class="text-[#a78b83]">SSL/TLS</span>
</div>
</div>
<!-- Form Body Section -->
<div class="p-5 flex flex-col space-y-5 bg-[#181c1f]">
<!-- VaiTro Selection Segmented Control -->
<div class="flex flex-col space-y-2">
<div class="flex items-center justify-between">
<span class="text-[11px] uppercase tracking-wider font-semibold text-[#868e96] font-mono">Vai trò phiên đăng nhập</span>
<span class="text-[11px] text-[#767e88]">Session Context</span>
</div>
<div class="grid grid-cols-2 gap-2 p-1 bg-[#121517] rounded-md border border-[#262a2e]">
<label class="flex items-center justify-center gap-2 py-2 px-3 rounded cursor-pointer transition-all has-[:checked]:bg-[#262a2e] has-[:checked]:text-[#f5ede8] has-[:checked]:border has-[:checked]:border-[#3d4349] text-[#868e96] hover:text-[#cfd5dc]">
<input checked="" class="sr-only" name="authRole" type="radio" value="LANDLORD"/>
<span class="material-symbols-outlined text-[16px]">shield_person</span>
<span class="text-xs font-medium">Chủ trọ / Quản lý</span>
</label>
<label class="flex items-center justify-center gap-2 py-2 px-3 rounded cursor-pointer transition-all has-[:checked]:bg-[#262a2e] has-[:checked]:text-[#f5ede8] has-[:checked]:border has-[:checked]:border-[#3d4349] text-[#868e96] hover:text-[#cfd5dc]">
<input class="sr-only" name="authRole" type="radio" value="TENANT"/>
<span class="material-symbols-outlined text-[16px]">person</span>
<span class="text-xs font-medium">Khách thuê phòng</span>
</label>
</div>
</div>
<!-- Credentials Fieldset -->
<div class="space-y-4 pt-1">
<!-- TenDangNhap Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="text-xs font-medium text-[#d4dadf]" for="txtUsername" id="lblUsername">Tài khoản quản trị (TenDangNhap / Mã QL):</label>
<span class="font-mono text-[10px] text-[#a78b83] uppercase tracking-wider bg-[#221c1a] px-1.5 py-0.5 rounded border border-[#3d2a24]">Required</span>
</div>
<div class="flex items-center tactile-input rounded px-3 py-2">
<span class="material-symbols-outlined text-[17px] text-[#636c75] mr-2.5">badge</span>
<input class="w-full bg-transparent text-xs sm:text-sm text-[#f0f3f6] placeholder-[#555d66] font-mono outline-none border-0 p-0 focus:ring-0" id="txtUsername" placeholder="Nhập mã định danh..." type="text" value="admin"/>
</div>
</div>
<!-- MatKhau Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="text-xs font-medium text-[#d4dadf]" for="txtPassword">Mật khẩu xác thực (MatKhau):</label>
<a class="text-xs text-[#ea6944] hover:text-[#ffb5a0] transition-colors" href="javascript:void(0)">Quên mật khẩu?</a>
</div>
<div class="flex items-center tactile-input rounded px-3 py-2">
<span class="material-symbols-outlined text-[17px] text-[#636c75] mr-2.5">key</span>
<input class="w-full bg-transparent text-xs sm:text-sm text-[#f0f3f6] placeholder-[#555d66] font-mono outline-none border-0 p-0 focus:ring-0 tracking-wider" id="txtPassword" type="password" value="SystemSecret@2025"/>
<button aria-label="Toggle MatKhau Visibility" class="p-1 rounded text-[#767e88] hover:text-[#e0e3e7] hover:bg-[#202529] transition-colors" id="btnTogglePassword" type="button">
<span class="material-symbols-outlined text-[17px]" id="eyeIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Checkbox & Token Info -->
<div class="flex flex-wrap items-center justify-between gap-2 pt-1">
<label class="flex items-center space-x-2.5 cursor-pointer">
<input checked="" class="w-4 h-4 rounded bg-[#101417] border-[#363c42] text-[#ea6944] focus:ring-0 focus:ring-offset-0 cursor-pointer" id="chkRemember" type="checkbox"/>
<span class="text-xs text-[#a0a8b0] hover:text-[#e0e3e7] transition-colors">Ghi nhớ phiên đăng nhập (Local Encrypted Session)</span>
</label>
<span class="font-mono text-[10px] text-[#767e88] bg-[#121517] border border-[#262a2e] px-2 py-0.5 rounded">SHA-256</span>
</div>
</div>
<!-- Actions & Secondary Nav -->
<div class="pt-2 border-t border-[#262a2e] flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
<!-- Utility Links -->
<div class="flex items-center space-x-2 text-[11px] font-mono text-[#767e88]">
<button class="hover:text-[#e0e3e7] transition-colors underline-offset-2 hover:underline" type="button">Proxy Config</button>
<span class="text-[#3c444c]">/</span>
<button class="hover:text-[#e0e3e7] transition-colors underline-offset-2 hover:underline" type="button">CSDL Offline</button>
</div>
<!-- Action Buttons -->
<div class="flex items-center space-x-2.5">
<button class="flex-1 sm:flex-none h-9 px-4 rounded bg-[#202529] hover:bg-[#282f34] active:bg-[#181c1f] text-[#cfd5dc] border border-[#31373e] text-xs font-medium transition-all flex items-center justify-center space-x-1.5" id="btnCancel" type="button">
<span>Hủy bỏ</span>
<kbd class="font-mono text-[10px] text-[#767e88] bg-[#15191c] px-1 rounded border border-[#2b3036]">Esc</kbd>
</button>
<button class="flex-1 sm:flex-none h-9 px-5 rounded bg-[#ea6944] hover:bg-[#d95d39] active:bg-[#bf4a28] text-white border border-[#ff8e6e]/30 text-xs font-semibold shadow-sm transition-all flex items-center justify-center space-x-1.5 focus:outline-none focus:ring-2 focus:ring-[#ea6944] focus:ring-offset-2 focus:ring-offset-[#181c1f]" id="btnLogin" type="button">
<span class="material-symbols-outlined text-[16px]">login</span>
<span>Đăng Nhập</span>
<kbd class="font-mono text-[10px] text-[#fcefe8] bg-[#c34e2b] px-1 rounded">F5</kbd>
</button>
</div>
</div>
</div>
<!-- Industrial Engineering StatusStrip -->
<footer class="px-4 py-2.5 bg-[#121517] border-t border-[#262a2e] flex flex-wrap items-center justify-between text-[11px] font-mono text-[#767e88] gap-2">
<div class="flex items-center space-x-2 min-w-0">
<span class="w-2 h-2 rounded-full bg-[#56a070]"></span>
<span class="truncate text-[#9ea7b0]" id="lblStatus">Sẵn sàng nhận lệnh đăng nhập.</span>
</div>
<div class="flex items-center space-x-3 text-[10px]">
<span class="text-[#767e88]">.NET 8.0.4 x64</span>
<span class="text-[#3c444c]">•</span>
<span class="text-[#767e88]">PID 14088</span>
<span class="text-[#3c444c]">•</span>
<span class="text-[#56a070] font-semibold">NUM [ON]</span>
</div>
</footer>
</div>
</main>
<script>
  (function() {
    const txtUser = document.getElementById('txtUsername');
    const txtPass = document.getElementById('txtPassword');
    const btnToggle = document.getElementById('btnTogglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const radioRoles = document.querySelectorAll('input[name="authRole"]');
    const lblUser = document.getElementById('lblUsername');
    const btnLogin = document.getElementById('btnLogin');
    const lblStatus = document.getElementById('lblStatus');

    // VaiTro switcher label update
    radioRoles.forEach(r => {
      r.addEventListener('change', (e) => {
        if (e.target.value === 'TENANT') {
          lblUser.textContent = 'Số điện thoại khách thuê (Registered SoDienThoai):';
          if (txtUser.value === 'admin') txtUser.value = '0908123456';
        } else {
          lblUser.textContent = 'Tài khoản quản trị (TenDangNhap / Mã QL):';
          if (txtUser.value === '0908123456') txtUser.value = 'admin';
        }
      });
    });

    // Toggle MatKhau Visibility
    btnToggle.addEventListener('click', () => {
      const isPass = txtPass.getAttribute('type') === 'password';
      txtPass.setAttribute('type', isPass ? 'text' : 'password');
      eyeIcon.textContent = isPass ? 'visibility' : 'visibility_off';
    });

    // Submit Simulation
    btnLogin.addEventListener('click', () => {
      const originalText = btnLogin.innerHTML;
      btnLogin.disabled = true;
      btnLogin.innerHTML = '<span class="material-symbols-outlined text-[16px] animate-spin">sync</span><span>Đang kết nối...</span>';
      lblStatus.textContent = 'Gửi thông tin xác thực đến máy chủ TCP 127.0.0.1:8088...';

      setTimeout(() => {
        btnLogin.disabled = false;
        btnLogin.innerHTML = originalText;
        lblStatus.textContent = 'Đăng nhập thành công! Đang đồng bộ CSDL...';
        alert('Đăng nhập thành công với vai trò: ' + (document.querySelector('input[name="authRole"]:checked')?.value || 'LANDLORD'));
      }, 1000);
    });

    // Key shortcut binds (Esc & F5)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F5') {
        e.preventDefault();
        btnLogin.click();
      } else if (e.key === 'Escape') {
        lblStatus.textContent = 'Đã hủy thao tác.';
      }
    });
  })();
</script></body></html>
